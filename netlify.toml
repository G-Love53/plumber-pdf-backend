# ConnectQuote-first: root and /quote → instant intake (long-form stays at /index.html)
[build]
  publish = "Netlify"

# Quote-page visits post here. Proxy them to CID-PDF-API or the landing count stays at zero.
[[redirects]]
  from = "/api/*"
  to = "https://cid-pdf-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/connectquote.html"
  status = 302
  force = true

[[redirects]]
  from = "/quote"
  to = "/connectquote.html"
  status = 302
  query = ":query"
